name: Verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: PYTHONDONTWRITEBYTECODE=1 python3 tests/e2e/professional-render-worker.py
      - run: bash tests/e2e/video-publish-approval-db.sh
      # The legacy repository-wide lint backlog is tracked separately from blocking verification.
      - run: npm run lint
        continue-on-error: true
