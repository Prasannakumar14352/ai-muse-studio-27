services:
  render-worker:
    build: .
    environment:
      SUPABASE_URL: ${SUPABASE_URL:?set SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?set SUPABASE_SERVICE_ROLE_KEY}
    read_only: true
    tmpfs:
      - /tmp:size=2g,mode=1777
    cpus: 2
    mem_limit: 3g
    pids_limit: 128
    restart: unless-stopped
